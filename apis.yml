description: >-
  Hexcel Corporation (NYSE: HXL) is a global leader in advanced composite materials
  for the aerospace, defense and space, and industrial markets. Headquartered in
  Stamford, Connecticut and operating roughly 18 manufacturing facilities worldwide
  with about 5,800 employees, Hexcel produces HexTow carbon fiber, HexPly prepregs,
  HexWeb honeycomb, HexForce reinforcements, HexBond adhesives, HexFlow infusion
  resins, and HexTool tooling materials supplied into commercial aircraft, military
  platforms, space launch vehicles, wind energy blades, and industrial structures.
  Hexcel is a critical materials supplier to Boeing and Airbus and supports more than
  100 defense programs; it has no public developer portal, REST APIs, SDKs, or
  machine-readable product catalog. Customer interaction with technical resources is
  PDF-based (datasheets, technology manuals, brochures), and the company's GitHub
  organization (github.com/Hexcel) is registered but empty.
