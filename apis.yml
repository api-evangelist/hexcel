- type: Features
  data:
  - name: Aerospace-Grade Carbon Fiber
    description: >-
      HexTow continuous carbon fiber qualified on most major commercial aircraft
      and defense programs; Hexcel is the world's largest producer of aerospace
      carbon fiber.
  - name: Prepreg and Resin Systems
    description: >-
      HexPly prepregs and HexFlow infusion resins covering epoxy, BMI, cyanate
      ester, and phenolic chemistries for primary aircraft, satellite, wind, and
      industrial structures.
  - name: Honeycomb Core
    description: >-
      HexWeb aluminum, Nomex, thermoplastic, and fiberglass honeycomb cores —
      the company is the global leader in aerospace honeycomb manufacturing.
  - name: Woven and Multiaxial Reinforcements
    description: >-
      HexForce, HiTape, PrimeTex, and HiMax fabric reinforcements in carbon,
      glass, and aramid for dry preforms and infusion processes.
  - name: Structural Adhesives
    description: >-
      HexBond film adhesives, foaming films, primers, and paste adhesives engineered
      for bonded metal-to-composite and composite-to-composite assemblies.
  - name: Composite Tooling Materials
    description: >-
      HexTool machinable BMI and epoxy tooling prepregs for autoclave-rated
      composite molds and production tools.
- type: UseCases
  data:
  - name: Commercial Aircraft Primary Structure
    description: >-
      Carbon fiber, prepreg, and honeycomb materials supplied into Boeing 787,
      777X, Airbus A350, A320neo, and other commercial aircraft for wings,
      fuselage sections, empennage, and engine nacelles.
  - name: Defense and Military Aircraft
    description: >-
      Composites supplied into more than 100 military aircraft, helicopter,
      and missile programs for airframes, rotor blades, and structural assemblies.
  - name: Space and Launch Vehicles
    description: >-
      Carbon fiber and prepregs used in satellite buses, payload fairings,
      launch vehicle interstages, and space structures.
  - name: Wind Energy Blades
    description: >-
      Carbon fiber spar caps and glass fiber reinforcements for utility-scale
      wind turbine blades.
  - name: Industrial and Performance Applications
    description: >-
      Composite materials for automotive, marine, recreation, and performance
      industrial applications requiring high strength-to-weight ratios.
- type: Integrations
  data:
  - name: Boeing
    description: >-
      Long-running primary materials supplier into Boeing commercial aircraft
      programs including 787, 777X, and 737 platforms.
  - name: Airbus
    description: >-
      Primary composites supplier into Airbus commercial aircraft programs
      including A350, A320neo, and A220.
  - name: Embraer
    description: >-
      Materials supplier to Embraer; named Embraer Best Supplier of the Year
      for two consecutive years through 2026.
  - name: Defense Primes
    description: >-
      Materials and prepreg supplier to defense primes across more than 100
      military programs spanning fixed-wing, rotary-wing, and missile platforms.
  - name: Wind Turbine OEMs
    description: >-
      Carbon fiber and reinforcement supplier to global wind turbine blade
      manufacturers.
- type: Solutions
  data:
  - name: Commercial Aerospace
    description: >-
      Composite materials portfolio for commercial aircraft primary and
      secondary structure, engine nacelles, and interiors.
  - name: Defense and Space
    description: >-
      Materials qualified for military fixed-wing, rotary-wing, missile,
      satellite, and space launch applications.
  - name: Industrial
    description: >-
      Composite solutions for wind energy, automotive, marine, recreation,
      and high-performance industrial structures.
- type: NotableAbsences
  data:
  - name: No Developer Portal
    description: >-
      Hexcel publishes no developer portal, REST API, GraphQL endpoint, or
      machine-readable product catalog. All product information is distributed
      as PDF datasheets and brochures.
  - name: No OpenAPI Or SDKs
    description: >-
      No OpenAPI, AsyncAPI, JSON Schema, or language SDKs are published.
  - name: Empty GitHub Organization
    description: >-
      The github.com/Hexcel organization exists (created 2018-03-01) but contains
      zero public repositories.
  - name: No Public Pricing Or Status Page
    description: >-
      Pricing is quote-based via direct sales / regional terms-of-sale PDFs;
      no public status page is published.
  - name: No RSS Or Webhooks
    description: >-
      No RSS feed, webhook surface, or programmatic news/changelog distribution
      is offered.
